<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OneShot | SignUp</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav>
        <div class="logo">
            One<span>Shot.</span>
        </div>

        <div class="nav-links">
            <a href="#">ABOUT</a>
            <a href="#">MORE</a>
            <a href="#">PICK COUNTRY</a>
        </div>
    </nav>

    <main>

        <div class="signup-card">

            <div class="heading">
                <h1>YOUR LIFE.</h1>
                <h1 class="red">YOUR STORY.</h1>
                <p>Let's get to know you.</p>
            </div>

            <div class="form">

                <label>Name</label>
                <input
                    id="getName"
                    type="text"
                    placeholder="Enter your name"
                >

                <label>Date of Birth</label>
                <input
                    id="getDob"
                    type="text"
                    placeholder="DD/MM/YYYY"
                    maxlength="10"
                >

                <label>Country</label>
                <select id="getC">
                    <option value="">Select your country</option>
                </select>

                <button onclick="sub()">
                    START MY JOURNEY
                </button>

            </div>

            <p class="bottom-text">
                Your information stays on your device.
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
