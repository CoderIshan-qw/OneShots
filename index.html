<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OneShots — make your time count.">
    <title>OneShots | Start</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="signup-page">

    <header class="site-header">
        <a class="logo" href="index.html">OneShot<span>s.</span></a>
        <span class="header-note">MAKE IT COUNT.</span>
    </header>

    <main class="signup-container">

        <div class="eyebrow">YOUR TIME IS LIMITED.</div>

        <h1>YOUR LIFE.<br><span>LIVE IT.</span></h1>

        <p class="signup-subtitle">
            Create your personal statistical life-expectancy countdown.
        </p>

        <form class="form-card" id="signupForm">

            <div class="field">
                <label for="getName">NAME</label>
                <input id="getName" type="text"
                       placeholder="Enter your name"
                       autocomplete="name" maxlength="60" required>
            </div>

            <div class="field">
                <label for="getDob">DATE OF BIRTH</label>
                <input id="getDob" type="text"
                       placeholder="DD/MM/YYYY"
                       inputmode="numeric"
                       maxlength="10"
                       autocomplete="bday"
                       required>
                <span class="field-hint">DD / MM / YYYY</span>
            </div>

            <div class="field">
                <label for="getC">COUNTRY</label>
                <select id="getC" required>
                    <option value="">Loading countries...</option>
                </select>
            </div>

            <button id="continueBtn" type="submit">
                <span>SEE MY COUNTDOWN</span>
                <b>→</b>
            </button>

            <div class="privacy-note">
                Your details stay in your browser.
            </div>
        </form>

        <div class="bottom-hint">
            <i></i>
            START WITH ONE SECOND.
        </div>

    </main>

    <footer>
        OneShots<span>.</span> &nbsp;•&nbsp; Make every second count.
    </footer>

    <script src="script.js"></script>
</body>
</html>
