<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OneShots | Sign Up</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="signup-page">

    <header>
        <div class="logo">
            OneShot<span>s.</span>
        </div>
    </header>

    <main class="signup-container">

        <h1>YOUR LIFE.<br><span>START IT.</span></h1>

        <p class="signup-subtitle">
            Enter your details to calculate your life countdown.
        </p>

        <div class="form-card">

            <label for="getName">Name</label>
            <input
                id="getName"
                type="text"
                placeholder="Enter your name"
            >

            <label for="getDob">Date of Birth</label>
            <input
                id="getDob"
                type="text"
                placeholder="DD/MM/YYYY"
                maxlength="10"
            >

            <label for="getC">Country</label>
            <select id="getC">
                <option value="">Select your country</option>
            </select>

            <button onclick="sub()">CONTINUE</button>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
