<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OneShots | Your Life</title>

    <link rel="stylesheet" href="home.css">
</head>

<body>

    <div class="page">

        <!-- NAVBAR -->
        <nav class="navbar">

            <div class="logo">
                One<span>Shot.</span>
            </div>

            <div class="nav-links">
                <a href="#">HOME</a>
                <a href="#">ABOUT</a>
                <a href="#">WHY?</a>
            </div>

            <button class="logout-btn">
                LOG OUT
            </button>

        </nav>


        <!-- MAIN CONTENT -->
        <main>

            <section class="hero">

                <h1>
                    YOUR LIFE.
                    <span>LIVE IT.</span>
                </h1>

                <p class="subtitle">
                    Average life expectancy in <span id="country">your country</span>
                </p>


                <!-- COUNTDOWN -->
                <div class="countdown">

                    <div class="time-box">
                        <span id="years">00</span>
                        <small>YEARS</small>
                    </div>

                    <div class="time-box">
                        <span id="months">00</span>
                        <small>MONTHS</small>
                    </div>

                    <div class="time-box">
                        <span id="days">00</span>
                        <small>DAYS</small>
                    </div>

                    <div class="time-box">
                        <span id="hours">00</span>
                        <small>HOURS</small>
                    </div>

                    <div class="time-box">
                        <span id="minutes">00</span>
                        <small>MINUTES</small>
                    </div>

                    <div class="time-box">
                        <span id="seconds">00</span>
                        <small>SECONDS</small>
                    </div>

                </div>


                <p class="slipping">
                    Time is slipping.
                </p>


                <!-- LIFE EXPECTANCY CARD -->
                <div class="life-card">

                    <p>Average Life Expectancy</p>

                    <h2>
                        <span id="lifeExpectancy">00.0</span> Years
                    </h2>

                    <small>
                        Don't waste it.
                    </small>

                </div>

            </section>

        </main>


        <!-- BOTTOM PROGRESS -->
        <div class="bottom-line"></div>

    </div>


    <script src="home.js"></script>

</body>

</html>
